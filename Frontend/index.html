<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Construction Management System</title>

  <!-- Main Styles -->
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Auth Logic -->
  <script defer src="js/ui.js"></script>
  <script defer src="js/auth.js"></script>
</head>

<body class="auth-page">

  <!-- Animated background -->
  <div class="auth-bg-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
    <div class="shape shape-4"></div>
  </div>

  <div class="auth-container">
    <h1 class="app-title">Construction Management System</h1>

    <!-- Toggle Buttons -->
    <div class="form-toggle">
      <button id="show-login" class="active">Login</button>
      <button id="show-register">Register</button>
    </div>

    <!-- Login Form -->
    <form id="login-form" class="auth-form">
      <h2>Login</h2>

      <div class="input-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="Enter email" required />
      </div>

      <div class="input-group">
        <label>Password</label>
        <div class="password-toggle-container">
          <input type="password" id="login-password" placeholder="Enter password" required />
          <i class="fas fa-eye toggle-password" data-target="login-password"></i>
        </div>
      </div>

      <button type="submit" class="primary-btn">Login</button>
      <p id="login-message" class="message"></p>
    </form>

    <!-- Register Form -->
    <form id="register-form" class="auth-form hidden">
      <h2>Register</h2>

      <div class="input-group">
        <label>Name</label>
        <input type="text" id="register-name" placeholder="Full name" required />
      </div>

      <div class="input-group">
        <label>Email</label>
        <input type="email" id="register-email" placeholder="Email address" required />
      </div>

      <div class="input-group">
        <label>Password</label>
        <div class="password-toggle-container">
          <input type="password" id="register-password" placeholder="Min 6 characters" required />
          <i class="fas fa-eye toggle-password" data-target="register-password"></i>
        </div>
      </div>

      <div class="input-group">
        <label>Role</label>
        <select id="register-role" required>
          <option value="">Select role</option>
          <option value="client">Client</option>
          <option value="admin">Admin</option>
          <option value="engineer">Engineer</option>
          <option value="worker">Worker</option>
        </select>
      </div>

      <button type="submit" class="primary-btn">Register</button>
      <p id="register-message" class="message"></p>
    </form>
  </div>

</body>

</html>

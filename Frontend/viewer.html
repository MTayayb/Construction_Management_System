<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Viewer</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1e40af;
            --bg-color: #0f172a;
            --text-color: #f8fafc;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #viewer {
            width: 100vw;
            height: 100vh;
        }

        #controls {
            position: absolute;
            top: 24px;
            right: 24px;
            z-index: 100;
        }

        .download-btn {
            padding: 12px 24px;
            cursor: pointer;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: all 0.2s ease;
        }

        .download-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: var(--text-color);
            transition: opacity 0.5s ease;
        }

        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
    <!-- Use ESM for Three.js to avoid global script loading issues and ensure compatibility with modern modules -->
</head>

<body>
    <div id="loading-overlay">
        <div class="loader"></div>
        <p>Loading 3D Model...</p>
    </div>

    <div id="controls">
        <button class="download-btn" onclick="downloadModel()">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
            Download Model
        </button>
    </div>

    <div id="viewer"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const urlParams = new URLSearchParams(window.location.search);
        const modelFilename = urlParams.get('model');
        const modelUrl = `http://localhost:5500/uploads/${modelFilename}`;

        window.downloadModel = function () {
            if (!modelFilename) return;
            const a = document.createElement('a');
            a.href = modelUrl;
            a.download = modelFilename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        if (modelFilename) {
            initViewer();
        } else {
            document.getElementById('loading-overlay').innerHTML = '<p>No model specified in URL</p>';
        }

        function initViewer() {
            const container = document.getElementById("viewer");
            const loadingOverlay = document.getElementById('loading-overlay');

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a); // Match dark background

            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(5, 5, 5);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1;
            container.appendChild(renderer.domElement);

            const controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Better Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 1);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xffffff, 2);
            mainLight.position.set(5, 10, 7.5);
            scene.add(mainLight);

            const fillLight = new THREE.DirectionalLight(0xffffff, 1);
            fillLight.position.set(-5, 0, -5);
            scene.add(fillLight);

            const loader = new GLTFLoader();
            loader.load(modelUrl, (gltf) => {
                const model = gltf.scene;
                scene.add(model);

                // Center and scale model
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);

                model.position.x += (model.position.x - center.x);
                model.position.y += (model.position.y - center.y);
                model.position.z += (model.position.z - center.z);

                const cameraPos = maxDim * 2.5;
                camera.position.set(cameraPos, cameraPos, cameraPos);
                camera.lookAt(0, 0, 0);
                controls.target.set(0, 0, 0);
                controls.update();

                loadingOverlay.style.opacity = '0';
                setTimeout(() => loadingOverlay.style.display = 'none', 500);

            }, (xhr) => {
                // Progress
            }, (error) => {
                console.error(error);
                loadingOverlay.innerHTML = `<p style="color: #ef4444;">Failed to load model. Please ensure the file exists and is a valid 3D format.</p>`;
            });

            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
    </script>
</body>

</html>
